<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <title>SmartSoko — Fedha za Bodi</title>
  <script>
    // GitHub Pages SPA fallback: remember the requested path, then redirect to
    // the app root. index.html restores the path from sessionStorage.
    (function () {
      try { sessionStorage.setItem('spa_redirect', location.href) } catch (e) {}
      location.replace('/')
    })()
  </script>
</head>
<body></body>
</html>
