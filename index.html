<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSoko — Fedha za Bodi</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <script>
    // Restore path after GitHub Pages SPA fallback redirect.
    (function () {
      try {
        var r = sessionStorage.getItem('spa_redirect')
        if (r) { sessionStorage.removeItem('spa_redirect'); var u = new URL(r); if (u.pathname && u.pathname !== '/') history.replaceState(null, '', u.pathname + u.search + u.hash) }
      } catch (e) {}
    })()
  </script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
